name: kernel

# The XNU kernel and the prelinked image of this board. The kernel step needs macOS + Xcode
# (xcrun clang/ar with the iphoneos SDK); everything else (package, DarwinBoot, payload)
# builds on Linux against the same UniXNU checkout.

on:
  workflow_dispatch:
    inputs:
      device_ref:
        description: Device repository ref (defaults to the ref of this run)
        required: false
        default: ""
      unixnu_ref:
        description: UniXNU ref to build with
        required: false
        default: "main"
      steps:
        description: Steps to build
        type: choice
        options:
          - kernel
          - kernel payload
        default: "kernel"
      pre_build:
        description: Optional shell commands run in the UniXNU checkout before the kernel build
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "configs/**"
      - "board.toml"
      - "scripts/**"
      - "package/**"
      - "kits/**"
      - "patches/**"
      - "drivers/**"
      - ".github/workflows/kernel.yml"

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_DEVICE: ${{ github.workspace }}/device
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.unixnu_ref || 'main' }}
          path: unixnu
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.device_ref || github.ref }}
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Select the device
        working-directory: unixnu
        run: |
          ./unixnu defconfig sirius_defconfig
          python3 - <<'PY'
          import os, tomllib
          board = tomllib.load(open(os.path.join(os.environ['UNIXNU_DEVICE'], 'board.toml'), 'rb'))
          print(f'board: {board["board"]["name"]}')
          PY

      - name: Run pre-build steps
        if: inputs.pre_build != ''
        working-directory: unixnu
        env:
          PRE_BUILD: ${{ inputs.pre_build }}
          DEVICE_DIR: ${{ github.workspace }}/device
          GITHUB_TOKEN: ${{ github.token }}
        run: bash -euo pipefail -c "$PRE_BUILD"

      - name: Build kernel
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu build kernel

      # The archive step runs before the prelink, so it binds the storage imports from
      # scripts/data/storage-bindings.json. By now the prelink has fetched the pinned kernelcache,
      # so the record is proved against it here: a different image or slide fails the run.
      - name: Verify the recorded storage bindings
        working-directory: unixnu/out/sirius/ipados-17.7.11-21H461/sirius/tree
        run: |
          python3 scripts/derive-storage-bindings.py --check
          python3 - <<'PY'
          import json
          record = json.load(open('scripts/data/storage-bindings.json'))
          plan = json.load(open('../kernel/kernel.json'))
          assert plan['slide'] == record['slide'], 'record and prelink slides differ'
          storage = {e['segment']: e for e in plan['extents']
                     if e['module'] == 'com.apple.iokit.IOStorageFamily'}
          const, text = storage['__DATA_CONST'], storage['__TEXT_EXEC']
          table = int(record['dispatch_table'], 16) + record['slide']
          constructor = int(record['protected_constructor'], 16) + record['slide']
          assert const['va'] <= table < const['va'] + const['size'], 'dispatch table outside the prelinked segment'
          assert text['va'] <= constructor < text['va'] + text['size'], 'constructor outside the prelinked segment'
          print(f'PASS: {plan["candidate_sha256"][:16]} holds the dispatch table at {table:#x} '
                f'and the constructor at {constructor:#x}')
          PY

      - name: Build payload
        working-directory: unixnu
        if: contains(inputs.steps || 'kernel', 'payload') || contains(github.event.head_commit.message, 'payload')
        run: ./unixnu build payload

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          # Format 2 output layout: out/<device>/<os_profile>/<config>/
          work=unixnu/out/sirius/ipados-17.7.11-21H461/sirius
          cp "$work"/kernel/kernel.macho artifacts/ 2>/dev/null || true
          cp "$work"/kernel/kernel.macho.json artifacts/ 2>/dev/null || true
          cp "$work"/payload/payload.img artifacts/ 2>/dev/null || true
          cp "$work"/payload/payload.json artifacts/ 2>/dev/null || true
          cp "$work"/logs/kernel.log artifacts/kernel.log 2>/dev/null || true
          cp "$work"/logs/*.log artifacts/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/storage-abi/*.log artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sirius-${{ inputs.steps || 'kernel' }}-${{ github.run_number }}
          path: artifacts/*
          retention-days: 3
          if-no-files-found: error
