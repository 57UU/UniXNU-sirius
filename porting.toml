[[area]]
id = "power"
status = "planned"
components = []
paths = ["board.toml"]
inputs = [
  "PM660/PM660L over SPMI: the boot chain leaves them programmed and XNU does not re-program them. PON_SOFT_RB_SPARE (0x8f in the PMIC, 0x88f in U-Boot's encoding) is what ABL reads to pick the next boot target.",
]
configuration = [
  "[adt.defaults.u32] sets sleep-disabled = 1 so the CPU never parks waiting for a suspend implementation.",
]
procedure = [
  "Read the PMIC state through a read-only probe before writing anything, then add the PMIC command to U-Boot for the automatic-fastboot route.",
]
findings = [
  "No regulator or power-domain driver exists in the kernel: the board runs on the programming the boot chain left behind.",
]
completion = [
  "The kernel owns the regulators it needs and the boot target can be armed from software.",
]
limits = [
  "Sleep and resume are disabled rather than implemented.",
]
next_action = [
  "Add CONFIG_CMD_PMIC to U-Boot and confirm the pmic device name, the remaining half of the automatic-fastboot route.",
]
evidence = [
  { kind = "source", reference = "uboot/README.md", result = "The PMIC spare ABL reads and why it is the missing half of the fastboot route." },
]

[[area]]
id = "packaging"
status = "implemented"
components = ["XnuPrelink"]
paths = ["scripts/make-uboot-payload.py", "scripts/build-xnu-4k-baseline.sh", "dts/**"]
inputs = [
  "The payload FAT volume is the flashed artifact of this port; there is no boot.img.",
  "The prelink inputs (kernel path, roots, slide, early security initializer) come from the OS profile; the board does not override them.",
]
configuration = [
  "[payload] sets volume SIRIUSESP, 256 MiB, loader = payload, dram_size and the kernel command line.",
  "[payload.adt] keeps only chip_id: the platform seed is supplied per build with --unique-chip-id when the userland stages need it.",
]
procedure = [
  "./unixnu build kernel (container or macOS), ./unixnu build package, bash <tree>/scripts/build-darwinboot.sh when the driver fork changes, ./unixnu build payload --trust-cache <bundle>, and finally make-uboot-payload.py --marker --output the volume to flash.",
]
findings = [
  "The kernel step runs on Linux through UniXNU's toolchain installer inside a Podman image (containers/xnu-linux/), so the host stays untouched; the installer writes /opt/unixnu-linux and /usr/bin shims when run directly.",
  "scripts/build-xnu-4k-baseline.sh is a copy of the UniXNU script with two board deviations: the boot-progress interlock requires only the source crypto provider, and the board patch series is applied before the shared one.",
  "Format 2 applies only the patches the series list names, so native-smp-secondary.patch and sheng-platform-power.patch live in the sdm710 SoC series: without the second, zzz-boot-progress.patch loses its bsd_init.c context.",
  "The defconfig must not override CONFIG_XNU_NATIVE_ARCH_TIMER to n: build-xnu-4k-baseline.sh derives NATIVE_ARCH_TIMER from XNU_ARMCPU, and at 0 the ARM64 series compiles the BCM2837 local interrupt router write into start.s, which faults on SDM710 before the MMU is on.",
  "make-uboot-payload.py is what makes the volume bootable under U-Boot: it adds BOOTAA64.EFI and the DarwinBoot driver, writes the marker, and rewrites AppleARMCPU's IONameMatch in the prelinked kernel.",
]
completion = [
  "The kernel prelinks against the pinned 21H461 kernelcache, the payload contains the kernel, the ADT and the DarwinBoot driver, and the flashed volume boots from U-Boot.",
]
limits = [
  "The board kernel script and the container image need re-basing when UniXNU changes them; the board copy is a fork and drifts silently otherwise.",
]
next_action = [
