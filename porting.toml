  { kind = "device", reference = "docs/evidence/sirius-image4-wait-20261028-1522.log", command = "fastboot flash vendor payload-full.img; fastboot erase misc; fastboot reboot; sudo python3 scripts/capture-usb-console.py --wait 45 --duration 60 --output .scratch/console-sysctl-20261028-1522.log", revision = "89c5fa4025f7fcf62918ff0339f5280dd35fa29f", result = "The exec'd dyld passes kern.bootargs (MIB 1.149) and stops in sysctl MIB 101.100.118.100 = security.mac.img4.ignition_blob: 31 syscalls entered, 30 returned, the pid 1 saved user PC is the instruction after dyld's __sysctl svc, and the kernel stack is sysctl_root/sysctl. The handler waits without a timeout for IOAESAccelerator. Kernel sha256 0ff05f7f7fec75a54b5d6071c452bc6ce19f5d527eefb5d09a415e58742ed7e4, payload sha256 8cd27069616c276517d5a0acdbcfdcb600181fc05bee8a645ffc6bc8bce53b13." },
