]
evidence = [
  { kind = "source", reference = "docs/HANDOFF.zh-CN.md", result = "Build-deploy loop, the payload layout and the prelink invariants." },
]

[[area]]
id = "diagnostics"
status = "implemented"
components = []
paths = ["package/**", "scripts/patch-xnu-entry-probe.py", "scripts/xnu-panic-screen.c", "scripts/capture-usb-console.py", "docs/HANDOFF.zh-CN.md", "docs/evidence/**", "patches/xnu/**", "scripts/build-sirius-emmc.py"]
inputs = [
  "The panel and the USB console are the two evidence channels; since the DWC3 CDC console works, the host captures the kernel log directly and photographs are only a fallback.",
]
configuration = [
  "panic_screen = true patches the entry probe and the panic screen into the payload kernel.",
  "boot-progress=2 draws the kernel console lines; debug=0x14e keeps the debug output on.",
]
procedure = [
  "Record the last checkpoint printed on the panel and in the USB log for every boot, with the kernel and payload hashes of that run.",
]
findings = [
  "The kernel console stops feeding the USB ring before bsd_init, so IOLog and printf never reach the host from a driver; every report writes the ring directly through sirius_usb_log_char().",
  "The driver hands the ring over once per attach, but a host byte replays the whole ring, which is what makes capture-usb-console.py get the complete boot: an inline poll that breaks once the ring is drained, and nothing else, is the timing that works.",
  "The panel repaints from the timer interrupt, so a frozen panel is not a hang; checkpoints (armcpu-panic=N) and the panic-time forced refresh are what distinguish the two.",
  "Stage bands (entry, pre-MMU, panic) and the TOPO/PROBE/MEM rows replaced the LED and UART guessing of earlier bring-up.",
  "PAN must be measured at the fault and never cleared from a probe: clearing it panics machine_switch_context, and measuring it in a kernel thread reads a stale zero.",
  "A payload built without --trust-cache reports no external trust caches and AMFI kills launchd with namespace 9 / code 8; that is a packing slip, not a kernel regression.",
  "The systemos-union boot verifies the composition end to end: before the mount the table is apfs /dev/disk2s1 on / plus devfs; the SystemOS volume is found by UUID 8846FE78-2910-4297-AF97-D59BB6F8FC16 as /dev/disk4s1 and mounts on / with flags 0x14809021 (MNT_RDONLY|MNT_UNION), giving three mounts; the cache and dyld_shared_cache_arm64 lookups go from ENOENT to 0. The union is not the stop: launchd still issues the same 24 syscalls.",
  "The first eight pid 1 faults are demand page-ins of dyld's __TEXT, not a fault loop: the same offsets (0x18, 0x16704, 0x2e0c8, 0x36c38, ...) appear on every boot shifted by the ASLR slide, TTBR0 equals pmap->ttep, and the count stops at 122. dyld also writes its own __DATA_CONST chained fixups; the read is a translation fault and the write a level-3 permission fault, both resolved before the stop.",
  "The '24 launchd syscalls' was the trace cap, not the stop: with the cap raised to 256 the same boot enters 31 syscalls and returns from 30. The 26th is sysctl MIB 101.100.118.100 = security.mac.img4.ignition_blob; the pid 1 saved user PC is the instruction after dyld's __sysctl svc and the kernel stack is sysctl_root/sysctl, so the thread is parked inside the Image4 handler.",
  "That handler (AppleImage4) calls IOService::waitForMatchingService for IOAESAccelerator with timeout (1<<64)-1. SDM710 has no AES block, so the wait never returns and the ignition blob is never published. NativeAES (UniXNU drivers/SoftwareAES) is the software IOAESAccelerator; board.toml now builds build-arm-driver.py NativeAES and build-software-aes-bindings.py, and the defconfig sets CONFIG_XNU_NATIVE_AES=y.",
]
completion = [
  "Each claimed milestone has a reproducible command, a matching source and image revision and an accessible result.",
]
limits = [
  "The USB console hands over the ring as it stood at capture time, so a boot that hangs before the pump starts leaves only the panel.",
]
next_action = [
  "Add the boot row and hash triple to every hardware result recorded here, and attach the captured console log rather than a photograph whenever one exists.",
  "Read the post-NativeAES boot: sirius: sysctl mib 101.100.118.100 must return, NEMMC launchd pc must leave dyld's __sysctl return instruction, and NEMMC probe init syscalls must pass 31. If the thread still parks, check the NativeAES KAT/registration counters before suspecting the Image4 handler.",
]
evidence = [
  { kind = "source", reference = "docs/HANDOFF.zh-CN.md", result = "Entry probe, panic screen, panel rows and the evidence convention of the port." },
  { kind = "device", reference = "docs/evidence/sirius-usb-console-20261026-1605.log", command = "sudo python3 scripts/capture-usb-console.py --wait 60 --duration 190 --output /tmp/boot.log", revision = "366abe2948fdb0c1554f7e0b89b731160f4527a4", result = "3813 bytes of kernel log read from /dev/ttyACM0 over the DWC3 CDC console." },
  { kind = "device", reference = "docs/evidence/sirius-pan-fault-20261027-2106.log", command = "sudo python3 scripts/capture-usb-console.py --follow --output /tmp/boot-pan1.log --wait 240 --duration 420", revision = "9df9148c7e9c64ee0c9b0cd1e0caa4e0b8a2a4b6", result = "The fault environment of the pid 1 thread: SPSR_EL1 0x20400204 (PAN set), SCTLR_EL1 0x3454593d (SPAN clear), ID_AA64MMFR1_EL1 0x10212122 (PAN 0b0010), TTBR0_EL1 equal to pmap->ttep 0xa43f2800, ESR 0x9600004f at _bcopyout+0x38." },
  { kind = "device", reference = "docs/evidence/sirius-exec-after-pan-20261027-2125.log", command = "fastboot flash vendor /tmp/sirius-pan3.img; fastboot erase misc; fastboot reboot; sudo python3 scripts/capture-usb-console.py --follow --output /tmp/boot-pan3.log --wait 240 --duration 300", revision = "1b0109345881868736e7452384da8521ffaebf33", result = "The exec with CONFIG_XNU_NATIVE_PAN=y: execve activate 0, init execve returned 0, launchd thread at pc 0x1005dee50, 122 pid 1 faults and 24 syscalls. Kernel sha256 3a34007b8f31adf7b26a3e8419ff8728708d8242bbbfe8fb338ec5ca50ee73e4." },
  { kind = "device", reference = "docs/evidence/sirius-dyld-cache-absent-20261027-2155.log", command = "fastboot flash vendor /tmp/sirius-p1.img; fastboot erase misc; fastboot reboot; sudo python3 scripts/capture-usb-console.py --follow --output /tmp/boot-p1.log --wait 240 --duration 200", revision = "60f87f0e1b5c11c1df13f324372ade20ac89e45f", result = "The path lookups from the exec'd process root: com.apple.dyld and both arm64/arm64e caches ENOENT, /System/Cryptexes/OS ENOENT, /usr/lib/dyld and /sbin/launchd 0. Kernel sha256 8091fb20f0613d82a34df6467f05a4df6d8107dbd758e2a48753ff867f42c41d." },
