schema_version = 1

# Machine-checked record of the sirius port. `python3 scripts/porting-record.py check
# --device <this repository>` from a UniXNU checkout validates it, and the Device
# documentation workflow runs the same check.
#
# Status vocabulary: planned, implemented, host-verified, device-verified, not-applicable.
# Every claim here is backed by docs/HANDOFF.zh-CN.md, by the board sources listed in paths,
# or by a device observation recorded with its commit.
#
# This file states what the port *is* and what is still open. The measurement values, the
# judgements that later turned out wrong and the rules that keep the phone alive are in
# docs/archive/HANDOFF-stages.zh-CN.md; the per-commit history is git log.

[device]
name = "sirius"
soc = "SDM710"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Mi 8 SE running the UniXNU source kernel through its own U-Boot UEFI: entry, MMU, timer, PSCI, platform expert, IOKit, eMMC, APFS root, execve, the SystemOS read-only union over / and the dyld shared cache work on hardware. The exec'd dyld then parks in the Image4 ignition sysctl, whose original handler waits without a timeout for an IOAESAccelerator; the board now builds the software NativeAES provider and the next boot tests it."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "dts/**", "configs/**", ".github/**", ".gitignore", "local.toml.example"]
inputs = [
  "SoC: SDM710 (Kryo 360, 2x Cortex-A75 + 6x Cortex-A55), GIC-500 GICv3, 19.2 MHz Qualcomm XO counter, PSCI over SMC.",
  "DRAM: 6 GiB model, 2 GiB at 0x80000000 plus 0xfd6c0000 at 0x100000000, 0x17d6c0000 usable.",
  "Target OS: the unchanged iPad7,1 iPadOS 17.7.11 (21H461) restore image, the same kernelcache as fajita and sheng.",
  "Hardware sources: mainline sdm670.dtsi, the vendor kernel tree and measurements on the phone.",
]
configuration = [
  "board.toml is format 2 (schema_version = 2) and selects soc_source = sdm710 and os_profile = ipados-17.7.11-21H461.",
  "dts/sirius.dts describes memory, the eight cores and their affinities, and includes the SoC DTSI for the GIC, PSCI and counter.",
  "configs/sirius_defconfig keeps the first-console kernel configuration and turns off the profile settings the image does not use yet.",
  "The prelink roots, slide, early security initializer and Apple device-tree identity come from the OS profile; the board adds sleep-disabled, the product model and the button set.",
]
procedure = [
  "From a UniXNU checkout: ./unixnu defconfig sirius_defconfig -D ../UniXNU-sirius, then ./unixnu fetch and ./unixnu status --json.",
  "Compile the hardware tree through the payload step (prototype: dtc -I dts -O dtb -i <soc>/dts dts/sirius.dts).",
]
findings = [
  "Format 2 replaced the hand-written ADT generator of the legacy port (scripts/make-sirius-adt.py) with a board DTS: the payload step compiles the tree and derives kernel.macho.adt from it.",
  "The arm-io base is derived from the exported nodes, not written by hand: the GIC at 0x17a00000 makes the window start at 0x17000000, which XNU reads as the SoC base.",
  "The legacy port set ipad_identity = true; in format 2 the same identity is the OS profile's [adt] tables, so the board only states its deviations.",
]
completion = [
  "status --json resolves the ARM64, sdm710, iPadOS and device layers, prints a non-empty patch order and shows the device package as kits/sirius.",
  "The compiled hardware tree carries one contiguous memory range equal to payload.dram_size, eight enabled CPUs and a PSCI method.",
]
limits = [
  "The SoC profile carries only the GIC, PSCI, counter and the timer INTID; everything else is still board-local.",
]
next_action = [
  "A kit source added to package/ needs its build-<name>.py recipe and a [kernel] archives entry, or the kernel links without it.",
]
evidence = [
  { kind = "source", reference = "docs/HANDOFF.zh-CN.md", result = "Board description, the profiles it selects and the ADT it generates." },
]

[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["scripts/make-uboot-payload.py", "drivers/DarwinBoot/**", ".gitmodules", "uboot/**", "efi/**"]
inputs = [
  "The device runs sirius-distro (mainline Linux) and its boot partition carries U-Boot 2026.07 (github.com/57UU/u-boot, branch sirius/v2.0, pinned to a2a847b1a84) with EFI_LOADER, the UEFI boot manager, GOP through vidconsole and EFI block volumes over FAT.",
  "UniXNU.efi is built on the host by ./unixnu build package from the vendored EDK II package (efi/, framework commit f85b5a6); DarwinBoot.efi is built from drivers/DarwinBoot.",
  "The payload volume goes to the unused vendor partition mmcblk0p80 (3 GiB) and is selected by a marker file. Chain: ABL -> U-Boot -> UEFI -> UniXNU.efi -> DarwinBoot.efi -> XNU.",
]
configuration = [
  "board.toml has no [firmware] table: there is no Mu-Silicium firmware and no boot image on this port. [payload] loader = \"payload\" makes the generated unixnu.toml load Payloads/DarwinBoot.efi as a [[driver]] instead of expecting it in a firmware volume.",
  "uboot/src is a shallow submodule at branch sirius/v2.0; uboot/unixnu-sirius.env is the board's stock default environment plus unixnu_boot/unixnu_check/unixnu_arm, the bootmenu entry they need and the bootcmd chain; uboot/build.sh builds boot-unixnu.img from the two.",
  "scripts/make-uboot-payload.py adds \\EFI\\BOOT\\BOOTAA64.EFI (UniXNU.efi) and the DarwinBoot.efi driver to the payload FAT volume.",
]
procedure = [
  "git submodule update --init --depth 1 uboot/src, then uboot/build.sh (needs CROSS_COMPILE and mkbootimg); fastboot flash boot that image, fastboot flash vendor the payload finished by make-uboot-payload.py --marker.",
  "U-Boot boots UniXNU when /EFI/UniXNU/BOOTUNIXNU exists on the vendor partition and boots Linux otherwise; recovery is sirius-distro's build/boot.img, which ignores the marker.",
]
findings = [
  "U-Boot needs no source change: its UEFI services are enough for UniXNU, DarwinBoot and XNU, so no Mu-Silicium platform port is needed for this board and the boot chain is environment text.",
  "DarwinBoot's GIC-500 pre-configuration (the iBoot role) is what lets the kernel pass lockdown and start kexts on this SoC; it must not enable the EL1 virtual timer PPI early, because on SDM710 that is INTID 19 and it fires before ArmCpu installs its handler.",
  "The payload finisher also rewrites AppleARMCPU's IONameMatch from cpu to xpu (equal length, nothing moves) so the kernelcache personality stops claiming this board's /cpus.",
  "mmc 0:50 is a hexadecimal partition number (0x50 = 80 = the vendor partition); 0:80 is read as 0x80 = 128 and fails with Invalid partition 128, and bootflow scan cannot find p80 because it stops after the first 30 partitions.",
  "U-Boot's own fastboot answers the whole getvar dialogue but flashing the vendor partition hangs: fastboot_tx_write() cancels the IN request before every queue and stock 2026.07 never received the dwc3 ENDTRANSFER/dequeue rework, so that cancel can strand a TRB the controller still owns. Writing the BCB command uboot-fastboot does enter it, so the missing half is the PMIC spare ABL reads, which needs CONFIG_CMD_PMIC and a verified pmic device name.",
  "Because unixnu_arm arms the BCB on every UniXNU boot, a fastboot flash followed by reboot usually lands in U-Boot's own fastboot (product mtp, version-bootloader U-Boot ...) instead of UniXNU; fastboot erase misc plus reboot puts the next start back in UniXNU, which scripts/flash-when-fastboot.py does automatically.",
]
completion = [
  "uboot/build.sh reproduces boot-unixnu.img from a fresh clone; with the marker in the payload U-Boot starts UniXNU.efi, and without it the phone boots Linux.",
  "The payload volume holds UniXNU.efi, DarwinBoot.efi, kernel.macho, kernel.macho.trustcache and the marker, and DarwinBoot hands control to the kernel with the device tree, framebuffer and command line.",
]
limits = [
  "The boot chain is U-Boot specific: it is not reproducible with the Mu-Silicium flow of the other ports and is not covered by ./unixnu firmware or ./unixnu bootimg.",
  "The EDK II package is a copy, not a submodule: keeping it in step with the framework is a manual diff of package/. The U-Boot submodule is shallow and pinned by commit.",
]
next_action = [
  "Keep the U-Boot side (sirius-distro) pinned by revision; it is the firmware for this port.",
  "Test the f_fastboot dequeue removal end to end: after a power cycle, flash boot from U-Boot's own fastboot, so a hung run comes back to a usable fastboot without the chord.",
  "Build UniXNU.efi from efi/ once and compare it with the framework's output, so the vendored copy is known good rather than assumed.",
]
evidence = [
  { kind = "source", reference = "docs/HANDOFF.zh-CN.md", result = "Boot-chain diagram, the marker-file boot rule and the DarwinBoot GIC pre-configuration rationale." },
  { kind = "source", reference = "uboot/README.md", result = "The U-Boot build recipe, the four environment lines that add the UniXNU chain, and the partition/short-scan traps." },
  { kind = "source", reference = "efi/README.md", result = "Provenance of the vendored EDK II package (framework commit f85b5a6) and what the payload takes from it." },
]

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["drivers/ArmCpu/**", "dts/sirius.dts"]
inputs = [
  "Eight Kryo 360 cores at Affinity1 0x000..0x700, boot CPU cpu0; cpu0-5 Cortex-A55, cpu6-7 Cortex-A75.",
  "GIC-500 distributor 0x17a00000/0x10000, redistributor 0x17a60000/0x100000, stride 0x20000.",
  "The EL1 virtual timer is GIC PPI 3 / INTID 19 (Apple uses PPI 11 / INTID 27); the SoC counter runs at 19.2 MHz.",
]
configuration = [
  "dts/sirius.dts lists all eight cores in boot order with their compatible strings; the ADT carries the same order.",
  "The kernel command line selects the board behaviour: sheng-smp=1, cpus=8, armcpu-self-ipi=1, armcpu-timer-intid=19.",
  "drivers/ArmCpu/ArmCpu.cpp is the board copy of the component: it adds the non-Apple timer INTID, the /cpus probe counters and the sheng-smp claim path.",
]
procedure = [
  "Build the kernel, then read the boot-progress TOPO and PROBE rows to confirm the topology and the probe decision.",
]
findings = [
  "The boot-progress TOPO row confirms the kernel topology on hardware: boot=0 max=7 nums=01234567.",
  "With sheng-smp=1 the native ArmCpu claims every /cpus nub; without it the kernelcache AppleARMCPU takes the nubs and panics with \"CPU configuration in device tree is invalid\" because it requires /cpus/max_cpus.",
]
completion = [
  "Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU with the board INTID.",
]
limits = [
  "The timer INTID and the claim path are board facts; a board with an Apple-shaped /cpus would not need sheng-smp=1.",
]
next_action = [
  "Record the TOPO and PROBE rows of every CPU-side change together with the kernel hash, so a regression names the CPU it came from.",
]
evidence = [
  { kind = "source", reference = "docs/HANDOFF.zh-CN.md", result = "Timer INTID measurement, the TOPO checkpoint and the AppleARMCPU panic analysis." },
]

[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/sirius.dts"]
inputs = [
  "Usable DRAM 0x17d6c0000 from 0x80000000 (6 GiB model: 2 GiB then 0xfd6c0000 at 0x100000000).",
  "The framebuffer handed over by U-Boot sits at 0x9c000000 (1080x2240 splash).",
]
configuration = [
  "The DTS memory node is a single contiguous range and board.toml repeats the size as [payload] dram_size; the driver refuses a mismatch.",
  "The ADT receives dram-base, dram-size and the CHRP NVRAM proxy from the payload step.",
]
procedure = [
  "Read the MEM row of the boot-progress panel and compare it with the DTS range.",
]
findings = [
  "The single contiguous range is what DarwinBoot's window allocation and the ADT handoff require; the two physical banks are described as one range on purpose.",
]
completion = [
  "The kernel memory map accounts for every handoff region, and no DMA engine or framebuffer range overlaps the kernel window.",
]
limits = [
  "SMMU behaviour is read only: the boot chain leaves it disabled and writing S2CR hung the SoC, so no DMA engine is brought up yet.",
]
next_action = [
  "Reconcile the memory map of the next boot with the DTS once an engine needs real DMA windows.",
]
evidence = [
  { kind = "source", reference = "docs/HANDOFF.zh-CN.md", result = "DRAM split, framebuffer address and the memory-map checkpoint." },
]

[[area]]
id = "storage"
status = "device-verified"
components = []
paths = ["docs/HANDOFF.zh-CN.md", "package/sirius_emmc.c", "package/NativeEmmc.cpp", "scripts/derive-storage-bindings.py"]
inputs = [
  "The reference unit is eMMC, not UFS: the UFS transport and its sheng integration points do not apply to this board.",
  "The original kernelcache is the only source of IOStorageFamily's addresses; its kext images carry no symbol table, so they are derived from the dispatch table itself.",
]
configuration = [
  "board.toml lists build-sirius-emmc.py (the SDCC1 probe) and build-native-emmc.py (the IOKit block driver) in [kernel] archives; CONFIG_XNU_NATIVE_UFS stays off.",
  "[userdata] carries the 512-byte geometry and the OS/SystemOS windows read from the device's own GPT.",
]
procedure = [
  "Build the kernel with that archive list: the driver's storage imports are bound at the prelink slide and archived with it.",
  "Read the evidence off the USB console: the probe prints the GPT rows, the driver the block count and the media table it publishes.",
]
findings = [
  "Five conditions had to hold at once before the data path moved: the RCG2 encoding (CFG 0x2017 at 400 kHz, 0x260B at 25 MHz), 1.8 V I/O, the 32-bit interrupt/error map at 0x30/0x32/0x36, the ADMA descriptor address at 0x58/0x5c rather than 0x00, and cache maintenance because the engine reads memory and not the CPU cache.",
  "IOStorageFamily is a kext of the original kernelcache, so the driver cannot link against it as an archive member: scripts/derive-storage-bindings.py identifies its dispatch table in the pinned kernelcache (only one __DATA_CONST table matches all 176 kernel-exported slot names) and binds the eleven imports at the prelink slide, so a wrong slide fails the derivation instead of the device.",
  "The SHNGROOT manifest at userdata LBA 17301504 describes the OS and SystemOS windows; publishing them as their own IOBlockStorageDevice makes APFS mount disk0, disk1s1 and disk2s1 (the OS volume DawnUpdate21H461.J120J121J207J208OS) and bsd_init completes.",
  "Every block device must transfer single-flight and without a sleeping lock (APFS mounts several volumes at once while the staging buffer and ADMA table are global), and doAsyncReadWrite has to complete inline: another thread, or a thread_call, silently drops or deadlocks completions. Requests now sit on a software queue that one drain services.",
  "The card clock is at 25 MHz (RCG CFG 0x260B, verified by reading the GPT signature back); 50 MHz would need the CMD6 high-speed switch.",
  "The volume this driver publishes as root is the OS window, which has launchd and dyld but no dyld shared cache; the cache belongs to the SystemOS window, so userland needs that window mounted rather than a storage change.",
]
completion = [
  "The eMMC registers, GPT and the SHNGROOT windows are correct; APFS mounts the OS volume, bsd_init completes, init execs /sbin/launchd and execve returns 0.",
]
limits = [
  "Read-only: the transfer path has no write command and reportWriteProtection() says so.",
  "The card clock is 25 MHz; nothing switches it into high speed yet.",
]
next_action = [
  "Decide whether the CMD6 high-speed switch to 50 MHz is worth it now that userland is the bottleneck, and keep the 25 MHz path as the fallback.",
  "Keep the trust-cache bundle in step with the OS build when the IPSW changes (its sha256 is pinned in board.toml [payload] trust_cache_sha256).",
]
evidence = [
  { kind = "device", reference = "docs/HANDOFF.zh-CN.md", command = "fastboot flash vendor sirius-obs.img; fastboot reboot; capture-usb-console.py --duration 240", revision = "d867b1d6498dc4d0f4ae4e18060762dcae6c5847", result = "NativeEmmc starts from bsd_init, publishes 0x747BFDF blocks of 512 bytes, and IOStorageFamily reads block 0, block 1 and block 2 with 21 sectors (the 84 GPT entries) through doAsyncReadWrite." },
  { kind = "host", reference = "docs/HANDOFF.zh-CN.md", command = "./scripts/xnu-container.sh run bash -lc './unixnu build kernel --skip-setup -D ../sirius'", revision = "a47f0d6b4615c3cdebf92102400a1bc302eb6d73", result = "The kernel links with NativeEmmc in the image (kernel.macho sha256 372820eb1b2cd9ecee15d769d1296771d0c8141c2681626d54651a62473446b8)." },
  { kind = "device", reference = "docs/HANDOFF.zh-CN.md", command = "fastboot flash vendor sirius-if.img; fastboot reboot; capture-usb-console.py --duration 220", revision = "bb812428dccd1f676455813ad198ed2bee4a8e3e", result = "APFS mounts disk0/disk1s1/disk2s1, bsd_init completes and execve of /sbin/launchd prints activate enter, namei 0 and finally execve activate 0." },
  { kind = "source", reference = "package/sirius_emmc.c", result = "SDCC1 bring-up, the ADMA2 read path and the GPT parse." },
]

[[area]]
id = "display"
status = "implemented"
components = []
paths = ["package/BootProgress.c", "package/BootLog.c", "package/Font.h", "scripts/build-boot-progress.py"]
inputs = [
  "U-Boot hands over a 1080x2240 splash framebuffer at 0x9c000000 through GOP (vidconsole).",
  "The panel is 1080x2244 DSI; there is no backlight or display driver in the kernel yet.",
]
configuration = [
  "CONFIG_XNU_BOOT_PROGRESS=y links the boot-progress layer; boot-progress=2 on the command line draws the kernel console lines.",
  "package/Font.h is vendored from Mu-Silicium, so the archive builds without a UEFI checkout.",
]
procedure = [
  "Build kernel, payload and volume, boot, and read the panel: stage lines, TOPO, PROBE, MEM, EMMC and USB rows, and panic text.",
]
findings = [
  "The panel is the readable kernel log of this port: it renders the console, the TOPO/PROBE/MEM rows and panic() output, and since the panic snapshot patch it re-renders at panic time so the rows are not a stale frame.",
  "Its rows cannot touch kernel state that is not initialised yet: boot_progress_init() draws before ml_parse_cpu_topology(), so the TOPO row guards topology_info against NULL.",
  "A frozen panel is not proof of a hang: the panel repaints from the timer interrupt, so before ArmCpu enables the timer PPI the last painted frame stays while the kernel still runs.",
]
completion = [
  "A known frame appears with correct geometry, and the kernel console and panic output stay readable on the panel.",
]
limits = [
  "This is a firmware framebuffer text surface, not a Darwin display driver: no IOMobileFramebuffer, no backlight, no modesetting.",
]
next_action = [
  "Keep the panel as the diagnostic surface until a display provider exists, and record each new row it prints.",
]
evidence = [
  { kind = "source", reference = "docs/HANDOFF.zh-CN.md", result = "Panel layout, row meanings and the panic-time snapshot." },
]

