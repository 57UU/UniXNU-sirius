]
configuration = [
  "[adt.buttons] publishes the button set and [adt.defaults.u32] sets sleep-disabled = 1, because there is no suspend/resume path.",
]
procedure = [
  "Add the SPI/I2C controller and the touch device to dts/sirius.dts, then confirm the panel reports input nodes.",
]
findings = [
  "The buttons are device-tree identity only: no input hardware driver exists, and none is needed to reach userland.",
]
completion = [
  "A touch or key event reaches userland through IOHIDFamily.",
]
limits = [
  "No input hardware driver: volume and power keys work through the boot chain, not through XNU.",
]
next_action = [
  "Start with the volume keys through the PMIC/GPIO path before the touch controller.",
]
evidence = [
